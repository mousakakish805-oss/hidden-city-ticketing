<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Hidden-City Ticketing</title>
    <meta
      name="description"
      content="Find flights that stop at your destination on the way somewhere further, and cost less."
    />

    <!--
      One superfamily in three roles. Plex Sans sets prose, Plex Mono sets
      coupon data (a ticket really is machine-printed, so the mono is the
      subject's own voice rather than decoration), and Plex Sans Arabic keeps
      the Arabic side of a bilingual site from being drawn by a different hand.
      Weights are pinned to the four actually used; the whole family would be
      several hundred kilobytes for faces nothing renders.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
