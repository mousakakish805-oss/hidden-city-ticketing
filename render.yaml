# Render blueprint: the API, the database, and (optionally) the website.
#
# Render reads this file and provisions everything in one go:
#   dashboard.render.com -> New -> Blueprint -> pick this repository
#
# This project is deployed as: API here on Render, website on Netlify.
#
# The image still builds and serves its own copy of the website. That is not
# waste -- it means this URL alone is a working site, which is the quickest
# way to tell an API problem apart from a Netlify problem when something
# breaks.
#
# Order matters, because each side needs the other's address:
#   1. Deploy here first and note the URL (https://<name>.onrender.com)
#   2. Build and deploy the website to Netlify with VITE_API_BASE set to it
#   3. Come back and set CORS_ORIGINS to the Netlify address
#
# Until step 3 the browser will refuse the API calls, and that is CORS doing
# its job, not a bug.

services:
  - type: web
    name: hidden-city
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt          # closest of Render's regions to Jordan
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEBUG
        value: "false"

      # Alembic owns the schema in production; the container runs
      # `alembic upgrade head` before serving. create_all cannot alter a
      # table that already exists, so it must not be relied on here.
      - key: AUTO_CREATE_SCHEMA
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: hidden-city-db
          property: connectionString

      # Set this in the dashboard once Netlify has given you an address, e.g.
      #   https://your-site.netlify.app
      # Comma-separated if you have more than one (a custom domain, previews).
      # Leave it unset and the website on Netlify cannot call this API at all.
      - key: CORS_ORIGINS
        sync: false

      # --- Flight data -----------------------------------------------------
      # Set these in the Render dashboard, NOT here. Anything written in this
      # file is committed to the repository.
      #
      # Only the group matching FLIGHT_PROVIDER needs values; the rest can stay
      # empty. Switching provider is FLIGHT_PROVIDER plus that group's keys.
      - key: FLIGHT_PROVIDER
        sync: false

      # amadeus -- developers.amadeus.com -> My Self-Service Workspace
      # AMADEUS_BASE_URL selects the environment and matters more than it looks:
      #   https://test.api.amadeus.com  free, but a limited cached subset of
      #                                 real data, so many routes return nothing
      #   https://api.amadeus.com       real live fares; requires moving the app
      #                                 to production in the portal
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: AMADEUS_BASE_URL
        sync: false

      # serpapi -- serpapi.com/manage-api-key, fronting Google Flights.
      # Published fares, no sandbox mode, and one search per market with no
      # retry tax -- so a user query costs MAX_CANDIDATE_DESTINATIONS + 1.
      - key: SERPAPI_KEY
        sync: false

      # rapidapi -- sky-scrapper.p.rapidapi.com
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        sync: false

      # --- Cost control ----------------------------------------------------
      # One upstream call per candidate, plus one for the baseline A -> B
      # market. What that costs depends on the provider:
      #
      #   serpapi   (MAX_CANDIDATE_DESTINATIONS + 1)      complete first time
      #   rapidapi  (MAX_CANDIDATE_DESTINATIONS + 1) x 2  first reply is a
      #                                                   fragment, so retried
      #
      # Against monthly allowances of 250 (SerpApi free) and 20 (RapidAPI
      # free), a value of 2 buys roughly 83 searches on the first and 3 on the
      # second. It was set to 2 for the RapidAPI plan.
      #
      # Fewer candidates is a budget decision, never a better search: each city
      # dropped is an anomaly that cannot be found. 8-12 is where this works
      # properly, and on 250/month even 4 leaves ~50 searches.
      - key: MAX_CANDIDATE_DESTINATIONS
        value: "2"
      - key: OFFER_CACHE_TTL_SECONDS
        value: "21600"
      - key: PROVIDER_CONCURRENCY
        value: "1"

      # One worker only. The live progress stream is in-process, so a second
      # worker would leave browsers watching a search running on the other
      # one. Add a Redis instance and REDIS_URL before raising this.
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: hidden-city-db
    plan: free
    region: frankfurt
